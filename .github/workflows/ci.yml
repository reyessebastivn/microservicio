name: CI/CD Pipeline - ProductosJSS

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

jobs:
  # Job 1: Compilar, ejecutar pruebas unitarias y análisis de seguridad
  build-test-security:
    runs-on: ubuntu-latest
    outputs:
      build_duration: ${{ steps.build_metrics.outputs.build_duration }}

    defaults:
      run:
        working-directory: ProductosJSS

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Registrar tiempo de inicio
        run: echo "START_TIME=$(date +%s)" >> $GITHUB_ENV

      - name: Ejecutar auditoría de cumplimiento técnico (Higiene de Git y Secretos)
        run: bash ../scripts/audit-compliance.sh

      - name: Ejecutar pruebas unitarias locales
        run: mvn clean test

      - name: Reporte de cobertura con JaCoCo
        run: mvn jacoco:report

      - name: Cache de paquetes de SonarCloud
        uses: actions/cache@v6
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Analizar con SonarCloud (Calidad Estática y Quality Gate)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        if: secrets.SONAR_TOKEN != ''
        run: mvn org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.projectKey=reyessebastivn_microservicio -Dsonar.organization=reyessebastivn -Dsonar.qualitygate.wait=true

      # Análisis estático de seguridad (SAST) con SpotBugs
      - name: Analisis SAST con SpotBugs
        run: mvn com.github.spotbugs:spotbugs-maven-plugin:4.8.6.0:check -Dspotbugs.failOnError=true -Dspotbugs.threshold=High

      # Escaneo de dependencias con Snyk (SCA) - Solo si se configuró el secret
      - name: Escaneo de dependencias con Snyk
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        if: secrets.SNYK_TOKEN != ''
        uses: snyk/actions/maven@master
        with:
          args: --severity-threshold=high --file=ProductosJSS/pom.xml

      # OWASP Dependency Check como segunda capa
      - name: Analisis de dependencias OWASP
        run: mvn dependency-check:check
        continue-on-error: true

      - name: Empaquetar aplicacion
        run: mvn package -DskipTests

      - name: Guardar el jar como artefacto
        uses: actions/upload-artifact@v7
        with:
          name: app-jar
          path: ProductosJSS/target/*.jar
          retention-days: 1

      - name: Registrar tiempo de finalización y empujar métricas de compilación
        if: always()
        run: |
          END_TIME=$(date +%s)
          BUILD_DURATION=$((END_TIME - START_TIME))
          echo "Duración del build: $BUILD_DURATION segundos"
          echo "build_duration=$BUILD_DURATION" >> $GITHUB_OUTPUT
        id: build_metrics

  # Job 2: Construir la imagen Docker y ejecutar pruebas unitarias dentro del contenedor
  docker-build:
    runs-on: ubuntu-latest
    needs: build-test-security

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Descargar el jar compilado
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: ProductosJSS/target/

      # Ejecuta pruebas dentro del contenedor debido al comando RUN en Dockerfile
      - name: Construir imagen Docker (Ejecuta pruebas en contenedor)
        run: docker build -t productosjss:${{ github.sha }} ./ProductosJSS

      - name: Verificar que la imagen existe
        run: docker images productosjss

      - name: Iniciar sesión en Docker Hub
        if: secrets.DOCKER_USERNAME != '' && secrets.DOCKER_PASSWORD != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Publicar imagen en Docker Hub
        if: secrets.DOCKER_USERNAME != '' && secrets.DOCKER_PASSWORD != ''
        run: |
          docker tag productosjss:${{ github.sha }} ${{ secrets.DOCKER_USERNAME }}/productosjss:latest
          docker tag productosjss:${{ github.sha }} ${{ secrets.DOCKER_USERNAME }}/productosjss:${{ github.sha }}
          docker push ${{ secrets.DOCKER_USERNAME }}/productosjss:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/productosjss:${{ github.sha }}

  # Job 3: Despliegue en Kubernetes (Entorno Simulado con KinD), pruebas de aceptación y métricas de CI/CD
  deploy:
    runs-on: ubuntu-latest
    needs: [docker-build, build-test-security]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    environment:
      name: production
      url: http://localhost:8081

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Crear archivo .env
        run: |
          echo "MYSQL_ROOT_PASSWORD=${{ secrets.MYSQL_ROOT_PASSWORD || 'rootpassword123' }}" >> .env
          echo "MYSQL_ROOT_USERNAME=root" >> .env
          echo "MYSQL_DATABASE=basejoyas" >> .env
          echo "JWT_SECRET=${{ secrets.JWT_SECRET || 'TuSuperClaveSecretaLarga_Y_Muy_Aleatoria_Para_Firmar_JWT_1234567890' }}" >> .env

      - name: Levantar Monitoreo con Docker Compose
        run: docker compose up -d prometheus grafana pushgateway

      - name: Crear clúster Kubernetes local (KinD)
        uses: helm/kind-action@v1.12.0

      - name: Construir y cargar imagen en KinD
        run: |
          docker build -t productosjss:${{ github.sha }} ./ProductosJSS
          kind load docker-image productosjss:${{ github.sha }} --name chart-testing

      - name: Desplegar manifiestos en Kubernetes
        run: |
          sed -i "s|reyessebastivn/productosjss:latest|productosjss:${{ github.sha }}|g" k8s/deployment.yaml
          kubectl apply -f k8s/configmap.yaml
          kubectl apply -f k8s/secrets.yaml
          kubectl apply -f k8s/db-service.yaml
          kubectl apply -f k8s/db-deployment.yaml
          kubectl apply -f k8s/service.yaml
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/istio.yaml

      - name: Esperar disponibilidad de los servicios en K8s
        run: |
          echo "Esperando que MySQL y la app levanten..."
          kubectl rollout status deployment/mysql-db --timeout=120s
          kubectl rollout status deployment/productosjss-app --timeout=120s

      - name: Exponer puerto del servicio en K8s
        run: |
          kubectl port-forward service/productosjss-service 8081:8081 &
          sleep 5

      - name: Ejecutar pruebas de aceptación
        run: bash scripts/acceptance-tests.sh http://localhost:8081

      - name: Enviar métricas dinámicas de CI/CD al Pushgateway
        if: always()
        run: |
          BUILD_DUR="${{ needs.build-test-security.outputs.build_duration }}"
          STATUS_VAL=0
          if [ "${{ job.status }}" = "success" ]; then
            STATUS_VAL=1
          fi
          bash scripts/push-metrics.sh http://localhost:9091 "$BUILD_DUR" "$STATUS_VAL" 0 0

      - name: Bajar el stack de monitoreo
        if: always()
        run: docker compose down -v